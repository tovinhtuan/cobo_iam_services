services:
  mysql:
    image: mysql:8.0
    container_name: cobo-iam-mysql
    environment:
      MYSQL_DATABASE: cobo_iam
      MYSQL_USER: cobo
      MYSQL_PASSWORD: cobo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: cobo-iam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: cobo-iam-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  migrate:
    image: mysql:8.0
    container_name: cobo-iam-migrate
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /release/backend
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cobo_iam
    volumes:
      - ./deploy-artifacts/backend:/release/backend:ro
    command: ["sh", "-c", "tr -d '\\r' < /release/backend/migrations/run_dev_migrations.sh | sh"]
    restart: "no"

  api:
    image: alpine:3.20
    container_name: cobo-iam-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    working_dir: /release/backend
    command: ["sh", "-c", "chmod +x /release/backend/bin/api && exec /release/backend/bin/api"]
    environment:
      SERVICE_NAME: cobo_iam_services
      ENV: development
      LOG_LEVEL: debug
      HTTP_ADDR: :8080
      MYSQL_DSN: cobo:cobo@tcp(mysql:3306)/cobo_iam?parseTime=true&loc=UTC&tls=false
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      EFFECTIVE_ACCESS_CACHE_TTL: 5m
      ACCESS_TOKEN_MODE: opaque
      ACCESS_TOKEN_TTL: 15m
      JWT_ISSUER: cobo_iam_services
      JWT_AUDIENCE: cobo_clients
      JWT_ALG: EdDSA
      JWT_CLOCK_SKEW_SEC: "60"
      PUBLIC_WEB_BASE_URL: http://localhost:3000
      PUBLIC_API_BASE_URL: http://localhost:8080
      WORKER_TICK_INTERVAL: 5s
      WORKFLOW_GROUPS_ENABLED: "true"
      WORKFLOW_DRAFT_ETAG_MODE: enforce
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./deploy-artifacts/backend:/release/backend

  web:
    image: nginx:1.27-alpine
    container_name: cobo-web-design
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped
    volumes:
      - ./deploy-artifacts/web/dist:/usr/share/nginx/html:ro
      - ./deploy-artifacts/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    image: alpine:3.20
    container_name: cobo-iam-worker
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    working_dir: /release/backend
    command: ["sh", "-c", "chmod +x /release/backend/bin/worker && exec /release/backend/bin/worker"]
    environment:
      SERVICE_NAME: cobo_iam_services
      ENV: development
      LOG_LEVEL: info
      MYSQL_DSN: cobo:cobo@tcp(mysql:3306)/cobo_iam?parseTime=true&loc=UTC&tls=false
      WORKER_TICK_INTERVAL: 5s
      ACCESS_TOKEN_MODE: opaque
      ACCESS_TOKEN_TTL: 15m
      PUBLIC_WEB_BASE_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@cobo.local}
    restart: unless-stopped
    volumes:
      - ./deploy-artifacts/backend:/release/backend

volumes:
  mysql_data:
