server {
  listen 80;
  server_name _;

  # Docker embedded DNS — avoids stale upstream when api container restarts after nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8080;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://$api_upstream/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /readyz {
    proxy_pass http://$api_upstream/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # index.html: no-cache so browser always fetches fresh entry point after deploy
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  # Hashed assets (JS/CSS): cache 1 year — content hash changes on each deploy
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
