# Rate limiting for listed-company lookup (public endpoint — abuse prevention).
# 10 req/min per IP, burst=3 for normal debounce behavior.
limit_req_zone $binary_remote_addr zone=listed_lookup:10m rate=10r/m;

# Broad per-IP rate and connection limits for FE and API proxy paths.
# api_per_ip: company-switch refreshes (~10–15 parallel /me* calls). 5r/s+burst20
# caused nginx 503 ("limiting requests") mid-switch on DEV; keep abuse protection
# but allow a single switch storm without failing ensureCompanyContext.
limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Retry-After: only emit value on 429; empty string on other statuses → nginx omits the header.
map $status $lookup_retry_after {
    429     "60";
    default "";
}

server {
  listen 80;
  server_name _;

  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 15s;
  client_max_body_size 5m;

  # Docker embedded DNS — avoids stale upstream when api container restarts after nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8080;

  root /usr/share/nginx/html;
  index index.html;

  # Listed company lookup — rate limited (public endpoint)
  location = /api/v1/company/listed-lookup {
    limit_req zone=listed_lookup burst=3 nodelay;
    limit_req_status 429;
    # Conditional Retry-After: $lookup_retry_after is "60" on 429, "" on others.
    # Empty string → nginx suppresses the header. Fixes: header was leaking on 200/400.
    add_header Retry-After $lookup_retry_after always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_conn conn_per_ip 40;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://$api_upstream/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /readyz {
    proxy_pass http://$api_upstream/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # index.html: no-cache so browser always fetches fresh entry point after deploy
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  # Hashed assets (JS/CSS): cache 1 year — content hash changes on each deploy
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    limit_req zone=web_per_ip burst=30 nodelay;
    limit_conn conn_per_ip 30;
    try_files $uri $uri/ /index.html;
  }
}
